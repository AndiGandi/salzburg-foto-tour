<script>
/* ---------------------------------------------------------
   GPX-ROUTE
   Die Route wird direkt aus Salzburg.gpx geladen.
   Stationskoordinaten bleiben davon vollständig unabhängig.
--------------------------------------------------------- */

let routeLayer = null;

async function routeLaden() {

    try {

        const response =
            await fetch("Salzburg.gpx");

        if (!response.ok) {
            throw new Error(
                "Salzburg.gpx konnte nicht geladen werden."
            );
        }

        const gpxText =
            await response.text();

        const parser =
            new DOMParser();

        const gpx =
            parser.parseFromString(
                gpxText,
                "application/xml"
            );

        const trackpunkte =
            [...gpx.querySelectorAll("trkpt")]
            .map(p => [
                Number(p.getAttribute("lat")),
                Number(p.getAttribute("lon"))
            ]);

        if (trackpunkte.length === 0) {
            throw new Error(
                "Keine GPX-Trackpunkte gefunden."
            );
        }

        routeLayer =
            L.polyline(
                trackpunkte,
                {
                    weight: 5,
                    opacity: 0.85
                }
            ).addTo(map);

        map.fitBounds(
            routeLayer.getBounds(),
            {
                padding: [20, 20]
            }
        );

    } catch (error) {

        console.error(error);

        document.getElementById(
            "status"
        ).innerHTML =
            "🔴 GPX-Route konnte nicht geladen werden";
    }
}


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

routeLaden();
stationenLaden();

</script>
