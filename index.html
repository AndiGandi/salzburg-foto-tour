<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salzburg Foto-Tour</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.75;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 16px;
        }

        #status {
            text-align: center;
            margin-bottom: 16px;
            font-size: 15px;
        }

        #karte {
            width: 100%;
            height: 420px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.12);
        }

        .station {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.08);
        }

        .nummer {
            font-size: 14px;
            font-weight: 700;
            color: #777;
            margin-bottom: 6px;
        }

        .station h2 {
            margin: 0 0 12px;
            font-size: 23px;
        }

        .beschreibung {
            line-height: 1.55;
            margin-bottom: 14px;
        }

        .besonderheit {
            background: #f1f1f1;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .fototipp {
            border-left: 4px solid #111;
            padding-left: 12px;
            line-height: 1.5;
        }

        .meta {
            margin-top: 16px;
            color: #666;
            font-size: 14px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #16803c;
        }

        .leaflet-popup-content {
            font-size: 15px;
        }

        .leaflet-popup-content strong {
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>📷 Salzburg Foto-Tour</h1>
    <p>Freitag · Altstadt & Mönchsberg</p>
</header>

<div class="container">

    <div id="status">
        🔄 Stationen werden geladen …
    </div>

    <div id="karte"></div>

    <div id="stationen"></div>

</div>

<script>

    const SUPABASE_URL =
        "https://nlwspalttrhebrpwqcpb.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_eRAkjZZrjGM3PJybVtDUGw_vYgwd5As";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    let karte = null;
    let stationsMarker = [];
    let stationsDaten = [];


    function karteErstellen() {

        karte = L.map("karte");

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap-Mitwirkende'
            }
        ).addTo(karte);
    }


    function markerErstellen(stationen) {

        stationsMarker = [];

        const koordinaten = [];


        stationen.forEach(station => {

            if (
                station.latitude === null ||
                station.longitude === null
            ) {
                return;
            }


            const position = [
                station.latitude,
                station.longitude
            ];


            koordinaten.push(position);


            const marker = L.marker(position)
                .addTo(karte)
                .bindPopup(`
                    <strong>
                        ${station.nummer}. ${station.titel}
                    </strong>
                    <br>
                    ${station.aufenthalt_minuten ?? "-"} Minuten
                `);


            stationsMarker.push(marker);
        });


        if (koordinaten.length > 0) {

            const grenzen = L.latLngBounds(koordinaten);

            karte.fitBounds(
                grenzen,
                {
                    padding: [25, 25]
                }
            );
        }
    }


    function stationenAnzeigen(stationen) {

        const container =
            document.getElementById("stationen");

        container.innerHTML = "";


        stationen.forEach(station => {

            const element =
                document.createElement("div");

            element.className = "station";


            element.innerHTML = `

                <div class="nummer">
                    STATION ${station.nummer}
                </div>

                <h2>
                    ${station.titel || ""}
                </h2>

                ${
                    station.beschreibung
                    ? `
                        <div class="beschreibung">
                            ${station.beschreibung}
                        </div>
                    `
                    : ""
                }

                ${
                    station.besonderheit
                    ? `
                        <div class="besonderheit">
                            <strong>⭐ Besonderheit</strong><br>
                            ${station.besonderheit}
                        </div>
                    `
                    : ""
                }

                ${
                    station.fototipp
                    ? `
                        <div class="fototipp">
                            <strong>📷 Fototipp</strong><br>
                            ${station.fototipp}
                        </div>
                    `
                    : ""
                }

                <div class="meta">
                    ⏱ Aufenthalt:
                    ${station.aufenthalt_minuten ?? "-"} Minuten
                </div>

            `;


            element.addEventListener(
                "click",
                () => {

                    const marker =
                        stationsMarker[station.nummer - 1];

                    if (marker) {

                        karte.setView(
                            marker.getLatLng(),
                            18
                        );

                        marker.openPopup();
                    }

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }
            );


            container.appendChild(element);
        });
    }


    async function stationenLaden() {

        const status =
            document.getElementById("status");


        try {

            const { data, error } =
                await supabaseClient
                    .from("stationen")
                    .select(`
                        id,
                        tag,
                        nummer,
                        titel,
                        beschreibung,
                        besonderheit,
                        fototipp,
                        latitude,
                        longitude,
                        aufenthalt_minuten,
                        aktiv
                    `)
                    .eq("tag", "Freitag")
                    .eq("aktiv", true)
                    .order("nummer", {
                        ascending: true
                    });


            if (error) {
                throw error;
            }


            stationsDaten = data || [];


            status.className = "success";

            status.innerHTML =
                `🟢 ${stationsDaten.length} Stationen geladen`;


            stationenAnzeigen(
                stationsDaten
            );


            markerErstellen(
                stationsDaten
            );

        }

        catch (error) {

            console.error(
                "Supabase Fehler:",
                error
            );


            status.className = "error";

            status.innerHTML =
                "🔴 Fehler beim Laden der Stationen";
        }
    }


    karteErstellen();

    stationenLaden();

</script>

</body>
</html>
